<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presencia">
<link rel="manifest" href="./manifest.json">
<title>Control de Presencia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:          #0d0f14;
    --surface:     #161a23;
    --surface2:    #1e2330;
    --border:      #242835;
    --border2:     #2e3449;
    --inside:      #00e87a;
    --outside:     #ff3d5a;
    --inside-dim:  rgba(0,232,122,0.09);
    --outside-dim: rgba(255,61,90,0.09);
    --accent:      #4f7cff;
    --accent-dim:  rgba(79,124,255,0.12);
    --text:        #e8eaf0;
    --muted:       #5a6078;
    --muted2:      #3a3f54;
    --danger:      #ff3d5a;
    --warn:        #ffb547;
    --font-h:      'Syne', sans-serif;
    --font-m:      'DM Mono', monospace;
    --radius:      16px;
    --radius-sm:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-h);
    min-height: 100vh;
    min-height: 100dvh;
    background-image:
      linear-gradient(rgba(255,255,255,0.013) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.013) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  .app { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 4rem; }

  /* SYNC BAR */
  .sync-bar {
    display: flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-m); font-size: 0.65rem;
    color: var(--muted); margin-bottom: 1.5rem;
    padding: 0.5rem 0.8rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted2); transition: background 0.3s;
  }
  .sync-dot.syncing { background: var(--warn); animation: blink 0.6s ease-in-out infinite; }
  .sync-dot.ok      { background: var(--inside); }
  .sync-dot.error   { background: var(--outside); }
  .sync-text { flex: 1; }
  .btn-sync-now {
    background: none; border: 1px solid var(--border2); color: var(--muted);
    font-family: var(--font-m); font-size: 0.6rem; letter-spacing: 0.08em;
    padding: 0.2rem 0.5rem; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn-sync-now:hover { border-color: var(--accent); color: var(--accent); }

  /* HEADER */
  header {
    display: flex; align-items: flex-start;
    justify-content: space-between; margin-bottom: 2rem; gap: 1rem;
  }
  .header-left .eyebrow {
    font-family: var(--font-m); font-size: 0.65rem;
    letter-spacing: 0.22em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 0.35rem;
  }
  .header-left h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1;
  }
  .header-left .clock {
    font-family: var(--font-m); font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem;
  }
  .live-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--inside); margin-right: 5px;
    animation: blink 2s ease-in-out infinite; vertical-align: middle;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .header-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
  .btn-pill {
    flex-shrink: 0; background: var(--surface2); border: 1.5px solid var(--border2);
    color: var(--text); font-family: var(--font-m); font-size: 0.72rem;
    letter-spacing: 0.08em; padding: 0.55rem 0.9rem; border-radius: var(--radius-sm);
    cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
    transition: background 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap;
  }
  .btn-pill:hover  { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* CARDS */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.1rem; margin-bottom: 2rem; }
  .card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 1.6rem 1.3rem 1.4rem;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.16s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: var(--radius); opacity: 0; transition: opacity 0.22s ease; }
  .card.inside  { border-color: var(--inside);  box-shadow: 0 0 24px rgba(0,232,122,0.10); }
  .card.inside::before  { background: var(--inside-dim); opacity: 1; }
  .card.outside { border-color: var(--outside); box-shadow: 0 0 24px rgba(255,61,90,0.08); }
  .card.outside::before { background: var(--outside-dim); opacity: 1; }
  .card:hover  { transform: translateY(-3px); }
  .card:active { transform: scale(0.97); }

  .ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-anim 0.5s linear; pointer-events: none; background: rgba(255,255,255,0.07); }
  @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

  .card-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 0.9rem; display: block; border: 2px solid var(--border2); background: var(--surface2); position: relative; }
  .card-avatar-emoji { width: 64px; height: 64px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 0.9rem; }
  .card-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.9rem; position: relative; }
  .card-status { display: flex; align-items: center; gap: 0.45rem; font-family: var(--font-m); font-size: 1rem; font-weight: 500; letter-spacing: 0.03em; position: relative; }
  .card.inside  .status-text { color: var(--inside); }
  .card.outside .status-text { color: var(--outside); }
  .card-ts   { font-family: var(--font-m); font-size: 0.6rem; color: var(--muted); margin-top: 0.5rem; position: relative; }
  .card-hint { font-family: var(--font-m); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); margin-top: 0.8rem; position: relative; }

  /* POPUP */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 1rem; }
  .overlay.show { opacity: 1; pointer-events: all; }
  .popup { background: var(--surface); border: 1.5px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 360px; padding: 1.6rem; transform: translateY(20px) scale(0.97); transition: transform 0.22s ease; }
  .overlay.show .popup { transform: translateY(0) scale(1); }
  .popup-avatar { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem; }
  .popup-face { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: var(--surface2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  .popup-face img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .popup-title  { font-size: 1.1rem; font-weight: 800; }
  .popup-action { font-family: var(--font-m); font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
  .popup-action.entering { color: var(--inside); }
  .popup-action.leaving  { color: var(--outside); }
  .popup-label { font-family: var(--font-m); font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .popup-warn  { font-family: var(--font-m); font-size: 0.68rem; color: var(--warn); margin-bottom: 0.9rem; line-height: 1.5; }
  .time-input { background: var(--surface2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-m); font-size: 1.5rem; font-weight: 500; padding: 0.6rem 0.9rem; outline: none; width: 100%; transition: border-color 0.15s; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
  .time-input:focus { border-color: var(--accent); }
  .date-input { background: var(--surface2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-m); font-size: 0.9rem; padding: 0.5rem 0.9rem; outline: none; width: 100%; transition: border-color 0.15s; margin-bottom: 1.2rem; }
  .date-input:focus { border-color: var(--accent); }
  .popup-note { font-family: var(--font-m); font-size: 0.65rem; color: var(--muted); margin-bottom: 1.2rem; }
  .popup-btns { display: flex; gap: 0.6rem; }
  .btn-cancel  { flex: 1; background: var(--surface2); border: 1.5px solid var(--border2); color: var(--muted); font-family: var(--font-h); font-weight: 700; font-size: 0.9rem; padding: 0.65rem; border-radius: var(--radius-sm); cursor: pointer; transition: border-color 0.15s; }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .btn-confirm { flex: 2; background: var(--accent); border: none; color: #fff; font-family: var(--font-h); font-weight: 700; font-size: 0.9rem; padding: 0.65rem; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; }
  .btn-confirm:hover { opacity: 0.88; }

  /* LOGS */
  .logs-panel { background: var(--surface); border: 1.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 2rem; max-height: 0; opacity: 0; transition: max-height 0.4s ease, opacity 0.3s ease; }
  .logs-panel.open { max-height: 3000px; opacity: 1; }
  .logs-header { padding: 0.9rem 1.3rem; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .logs-header-title { font-family: var(--font-m); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .logs-filter { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .filter-btn { background: none; border: 1px solid var(--border2); color: var(--muted); font-family: var(--font-m); font-size: 0.6rem; letter-spacing: 0.08em; padding: 0.25rem 0.55rem; border-radius: 999px; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .filter-btn:hover  { border-color: var(--accent); color: var(--accent); }
  .logs-body { max-height: 420px; overflow-y: auto; }
  .logs-body::-webkit-scrollbar { width: 4px; }
  .logs-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .log-empty { padding: 2rem; text-align: center; font-family: var(--font-m); font-size: 0.72rem; color: var(--muted); }
  .log-day-label { padding: 0.5rem 1.3rem; font-family: var(--font-m); font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted2); background: var(--bg); position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--border); }
  .log-entry { display: flex; align-items: center; gap: 0.8rem; padding: 0.65rem 1.3rem; border-bottom: 1px solid var(--border); transition: background 0.12s; }
  .log-entry:last-child { border-bottom: none; }
  .log-entry:hover { background: rgba(255,255,255,0.02); }
  .log-face { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: var(--surface2); border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .log-face img { width: 100%; height: 100%; object-fit: cover; }
  .log-info { flex: 1; min-width: 0; }
  .log-name { font-size: 0.85rem; font-weight: 700; }
  .log-desc { font-family: var(--font-m); font-size: 0.62rem; color: var(--muted); margin-top: 0.1rem; }
  .log-desc .ev-in  { color: var(--inside); }
  .log-desc .ev-out { color: var(--outside); }
  .log-time { font-family: var(--font-m); font-size: 0.7rem; color: var(--muted); text-align: right; flex-shrink: 0; }
  .log-time .corrected { font-size: 0.55rem; color: var(--warn); display: block; margin-top: 0.1rem; }
  .log-del { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 0.85rem; padding: 0.2rem; transition: color 0.15s; flex-shrink: 0; }
  .log-del:hover { color: var(--danger); }
  .logs-footer { padding: 0.8rem 1.3rem; background: var(--surface2); border-top: 1px solid var(--border); display: flex; gap: 0.6rem; justify-content: flex-end; }
  .btn-export, .btn-clear-logs { background: none; border: 1px solid var(--border2); color: var(--muted); font-family: var(--font-m); font-size: 0.65rem; letter-spacing: 0.08em; padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; }
  .btn-export:hover     { border-color: var(--accent); color: var(--accent); }
  .btn-clear-logs:hover { border-color: var(--danger); color: var(--danger); }

  /* EDIT PANEL */
  .edit-panel { background: var(--surface); border: 1.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 2rem; max-height: 0; opacity: 0; transition: max-height 0.4s ease, opacity 0.3s ease; }
  .edit-panel.open { max-height: 2000px; opacity: 1; }
  .edit-panel-header { padding: 1rem 1.3rem; background: var(--surface2); border-bottom: 1px solid var(--border); font-family: var(--font-m); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .edit-list { padding: 0.5rem 0; }
  .edit-row { display: flex; align-items: center; gap: 0.9rem; padding: 0.9rem 1.3rem; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .edit-row:last-child { border-bottom: none; }
  .edit-row:hover { background: rgba(255,255,255,0.02); }
  .avatar-wrap { flex-shrink: 0; position: relative; width: 52px; height: 52px; cursor: pointer; }
  .avatar-preview { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--border2); background: var(--surface2); }
  .avatar-emoji-preview { width: 52px; height: 52px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  .avatar-overlay { position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; font-size: 1rem; opacity: 0; transition: opacity 0.15s; }
  .avatar-wrap:hover .avatar-overlay { opacity: 1; }
  .avatar-file-input { display: none; }
  .edit-fields { flex: 1; display: flex; flex-direction: column; gap: 0.45rem; }
  .field-label { font-family: var(--font-m); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .field-input { background: var(--surface2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-h); font-size: 0.95rem; font-weight: 700; padding: 0.45rem 0.7rem; outline: none; width: 100%; transition: border-color 0.15s; }
  .field-input:focus { border-color: var(--accent); }
  .btn-remove-photo { background: none; border: 1px solid var(--danger); color: var(--danger); font-family: var(--font-m); font-size: 0.6rem; letter-spacing: 0.08em; padding: 0.25rem 0.5rem; border-radius: 6px; cursor: pointer; white-space: nowrap; opacity: 0.7; transition: opacity 0.15s; align-self: flex-start; }
  .btn-remove-photo:hover { opacity: 1; }
  .edit-actions { display: flex; gap: 0.7rem; padding: 1rem 1.3rem; background: var(--surface2); border-top: 1px solid var(--border); }
  .btn-save { flex: 1; background: var(--accent); border: none; color: #fff; font-family: var(--font-h); font-weight: 700; font-size: 0.9rem; padding: 0.7rem 1rem; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; }
  .btn-save:hover { opacity: 0.88; }
  .btn-add { background: var(--surface); border: 1.5px solid var(--border2); color: var(--text); font-family: var(--font-h); font-weight: 700; font-size: 0.9rem; padding: 0.7rem 1rem; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .btn-add:hover { background: var(--surface2); border-color: var(--accent); }
  .btn-del-row { flex-shrink: 0; background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 0.3rem; line-height: 1; transition: color 0.15s; }
  .btn-del-row:hover { color: var(--danger); }

  /* TOAST */
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border2); border-radius: 999px; padding: 0.6rem 1.2rem; font-family: var(--font-m); font-size: 0.75rem; color: var(--text); opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 999; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { font-family: var(--font-m); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-align: center; margin-top: 1rem; }

  @media (max-width: 480px) {
    .app { padding: 1.2rem 0.75rem 3rem; }
    .grid { gap: 0.8rem; }
    .card { padding: 1.3rem 1.1rem 1.2rem; border-radius: 14px; }
    .edit-row { gap: 0.7rem; padding: 0.8rem 1rem; }
    .edit-actions { padding: 0.8rem 1rem; }
    .header-btns { gap: 0.4rem; }
    .btn-pill { font-size: 0.65rem; padding: 0.45rem 0.7rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SYNC BAR -->
  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <div class="sync-text" id="syncText">Conectando...</div>
    <button class="btn-sync-now" onclick="syncNow()">↻ Sincronizar</button>
  </div>

  <header>
    <div class="header-left">
      <div class="eyebrow"><span class="live-dot"></span>Sistema activo</div>
      <h1>Presencia</h1>
      <div class="clock" id="clock">—</div>
    </div>
    <div class="header-btns">
      <button class="btn-pill" id="btnLogs" onclick="toggleLogs()">📋 Logs</button>
      <button class="btn-pill" id="btnEdit" onclick="toggleEdit()">✏️ Editar</button>
    </div>
  </header>

  <div class="logs-panel" id="logsPanel">
    <div class="logs-header">
      <div class="logs-header-title">📋 Historial</div>
      <div class="logs-filter">
        <button class="filter-btn active" data-filter="all"     onclick="setFilter('all')">Todos</button>
        <button class="filter-btn"        data-filter="inside"  onclick="setFilter('inside')">Entradas</button>
        <button class="filter-btn"        data-filter="outside" onclick="setFilter('outside')">Salidas</button>
      </div>
    </div>
    <div class="logs-body" id="logsBody"></div>
    <div class="logs-footer">
      <button class="btn-export"     onclick="exportCSV()">⬇ Exportar CSV</button>
      <button class="btn-clear-logs" onclick="clearLogs()">🗑 Borrar todo</button>
    </div>
  </div>

  <div class="edit-panel" id="editPanel">
    <div class="edit-panel-header">⚙ Editar inquilinos</div>
    <div class="edit-list" id="editList"></div>
    <div class="edit-actions">
      <button class="btn-add"  onclick="addTenant()">＋ Agregar</button>
      <button class="btn-save" onclick="saveEdits()">Guardar cambios</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>PRESENCIA · sincronizado con Supabase</footer>
</div>

<div class="overlay" id="overlay" onclick="overlayClickOut(event)">
  <div class="popup">
    <div class="popup-avatar">
      <div class="popup-face" id="popupFace"></div>
      <div>
        <div class="popup-title"  id="popupName">—</div>
        <div class="popup-action" id="popupAction">—</div>
      </div>
    </div>
    <div class="popup-label">¿A qué hora ocurrió?</div>
    <div class="popup-warn">⚠ Ajusta si lo viste en cámara después</div>
    <input type="time" class="time-input" id="popupTime">
    <input type="date" class="date-input" id="popupDate">
    <div class="popup-note">Hora actual pre-llenada. Cámbiala si fue antes.</div>
    <div class="popup-btns">
      <button class="btn-cancel"  onclick="closePopup()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmChange()">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════

const TABLE = 'presencia_data';
const ROW_ID = 'singleton';

async function sbFetch(method, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${ROW_ID}`, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': method === 'PATCH' ? 'return=minimal' : 'return=representation',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  return method === 'PATCH' ? null : res.json();
}

/* Pull from Supabase → localStorage */
async function pullFromCloud() {
  setSyncStatus('syncing', 'Sincronizando...');
  try {
    const rows = await sbFetch('GET');
    if (rows && rows[0]) {
      const row = rows[0];
      if (row.tenants) localStorage.setItem(KEY_TENANTS, JSON.stringify(row.tenants));
      if (row.state)   localStorage.setItem(KEY_STATE,   JSON.stringify(row.state));
      if (row.logs)    localStorage.setItem(KEY_LOGS,    JSON.stringify(row.logs));
    }
    setSyncStatus('ok', 'Sincronizado · ' + fmtTime(Date.now()));
    return true;
  } catch(e) {
    setSyncStatus('error', 'Sin conexión · datos locales');
    return false;
  }
}

/* Push localStorage → Supabase */
async function pushToCloud() {
  setSyncStatus('syncing', 'Guardando...');
  try {
    await sbFetch('PATCH', {
      tenants:    loadTenants(),
      state:      loadState(),
      logs:       loadLogs(),
      updated_at: new Date().toISOString(),
    });
    setSyncStatus('ok', 'Guardado · ' + fmtTime(Date.now()));
  } catch(e) {
    setSyncStatus('error', 'Error al guardar · reintentando...');
    setTimeout(pushToCloud, 5000);
  }
}

function setSyncStatus(state, text) {
  const dot  = document.getElementById('syncDot');
  const span = document.getElementById('syncText');
  dot.className  = 'sync-dot ' + state;
  span.textContent = text;
}

async function syncNow() {
  await pullFromCloud();
  renderCards();
  if (logsOpen) renderLogs();
}

/* Auto-sync cada 30 segundos */
setInterval(syncNow, 30000);

/* ═══════════════════════════════════════
   STORAGE (localStorage como caché)
═══════════════════════════════════════ */
const KEY_TENANTS = 'presencia_tenants_v2';
const KEY_STATE   = 'presencia_state_v2';
const KEY_LOGS    = 'presencia_logs_v1';

const DEFAULT_TENANTS = [
  { id: 't1', name: 'Juan',   photo: null },
  { id: 't2', name: 'María',  photo: null },
  { id: 't3', name: 'Carlos', photo: null },
];
const EMOJIS = ['🧑','👩','🧔','👨','👧','🧒','👴','👵','🤷','🙋'];

function loadTenants() { try { return JSON.parse(localStorage.getItem(KEY_TENANTS)) || DEFAULT_TENANTS; } catch { return DEFAULT_TENANTS; } }
function saveTenants(t) { localStorage.setItem(KEY_TENANTS, JSON.stringify(t)); }
function loadState()   { try { return JSON.parse(localStorage.getItem(KEY_STATE))   || {}; } catch { return {}; } }
function saveState(s)  { localStorage.setItem(KEY_STATE,   JSON.stringify(s)); }
function loadLogs()    { try { return JSON.parse(localStorage.getItem(KEY_LOGS))    || []; } catch { return []; } }
function saveLogs(l)   { localStorage.setItem(KEY_LOGS,    JSON.stringify(l)); }

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function uid()   { return 't' + Date.now() + Math.random().toString(36).slice(2,5); }
function logId() { return 'l' + Date.now() + Math.random().toString(36).slice(2,6); }
function fmtFull(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function fmtTime(ts) { if (!ts) return ''; return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'long'}); }
function todayStr()   { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowTimeStr() { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function parseDatetime(ds,ts) { return new Date(ds+'T'+ts+':00').getTime(); }
function tenantEmoji(i) { return EMOJIS[i % EMOJIS.length]; }
function getTenant(id)  { return loadTenants().find(t => t.id === id); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2400);
}
function ripple(card, e) {
  const r = document.createElement('span'); r.className = 'ripple';
  const rect = card.getBoundingClientRect(), sz = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
  card.appendChild(r); r.addEventListener('animationend', () => r.remove());
}

/* ═══════════════════════════════════════
   CARDS
═══════════════════════════════════════ */
function renderCards() {
  const tenants = loadTenants(), state = loadState();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  tenants.forEach((t, i) => {
    const info = state[t.id] || { inside: false, ts: null };
    const isIn = info.inside;
    const card = document.createElement('div');
    card.className = 'card ' + (isIn ? 'inside' : 'outside');
    const avatar = t.photo ? `<img class="card-avatar" src="${t.photo}" alt="${t.name}">` : `<div class="card-avatar-emoji">${tenantEmoji(i)}</div>`;
    card.innerHTML = `${avatar}<div class="card-name">${t.name}</div><div class="card-status"><span>${isIn?'✅':'❌'}</span><span class="status-text">${isIn?'DENTRO':'FUERA'}</span></div><div class="card-ts">${info.ts?'Desde '+fmtFull(info.ts):'Sin registro'}</div><div class="card-hint">Toca para registrar</div>`;
    card.addEventListener('click', e => { ripple(card, e); openPopup(t.id, !isIn, i); });
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════════
   POPUP
═══════════════════════════════════════ */
let pendingId = null, pendingInside = null;

function openPopup(id, willBeInside, idx) {
  pendingId = id; pendingInside = willBeInside;
  const t = getTenant(id);
  const face = document.getElementById('popupFace');
  face.innerHTML = t.photo ? `<img src="${t.photo}" alt="${t.name}">` : tenantEmoji(idx);
  document.getElementById('popupName').textContent = t.name;
  const ac = document.getElementById('popupAction');
  ac.textContent = willBeInside ? '→ Registrar ENTRADA' : '→ Registrar SALIDA';
  ac.className = 'popup-action ' + (willBeInside ? 'entering' : 'leaving');
  document.getElementById('popupTime').value = nowTimeStr();
  document.getElementById('popupDate').value = todayStr();
  document.getElementById('overlay').classList.add('show');
}
function closePopup() { document.getElementById('overlay').classList.remove('show'); pendingId = null; pendingInside = null; }
function overlayClickOut(e) { if (e.target === document.getElementById('overlay')) closePopup(); }

function confirmChange() {
  const tv = document.getElementById('popupTime').value;
  const dv = document.getElementById('popupDate').value;
  if (!tv || !dv) { showToast('Ingresa hora y fecha'); return; }
  const chosenTs = parseDatetime(dv, tv);
  const corrected = Math.abs(Date.now() - chosenTs) > 60000;

  const s = loadState();
  s[pendingId] = { inside: pendingInside, ts: chosenTs };
  saveState(s);

  const logs = loadLogs();
  logs.unshift({ id: logId(), tenantId: pendingId, inside: pendingInside, ts: chosenTs, recordedAt: Date.now(), corrected });
  saveLogs(logs);

  closePopup();
  renderCards();
  if (logsOpen) renderLogs();
  pushToCloud();
  showToast(corrected ? '✅ Registrado con hora corregida' : '✅ Registrado');
}

/* ═══════════════════════════════════════
   LOGS
═══════════════════════════════════════ */
let logsOpen = false, logFilter = 'all';

function toggleLogs() {
  logsOpen = !logsOpen;
  document.getElementById('logsPanel').classList.toggle('open', logsOpen);
  document.getElementById('btnLogs').classList.toggle('active', logsOpen);
  if (logsOpen) renderLogs();
}
function setFilter(f) {
  logFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderLogs();
}
function renderLogs() {
  const tenants = loadTenants();
  let logs = loadLogs();
  if (logFilter === 'inside')  logs = logs.filter(l => l.inside);
  if (logFilter === 'outside') logs = logs.filter(l => !l.inside);
  const body = document.getElementById('logsBody');
  if (!logs.length) { body.innerHTML = '<div class="log-empty">Sin registros aún</div>'; return; }
  const groups = {};
  logs.forEach(l => { const k = new Date(l.ts).toDateString(); if (!groups[k]) groups[k]=[]; groups[k].push(l); });
  body.innerHTML = '';
  Object.keys(groups).forEach(key => {
    const dayDiv = document.createElement('div');
    const lbl = document.createElement('div'); lbl.className='log-day-label'; lbl.textContent=fmtDate(groups[key][0].ts);
    dayDiv.appendChild(lbl);
    groups[key].forEach(l => {
      const t=tenants.find(x=>x.id===l.tenantId), idx=tenants.findIndex(x=>x.id===l.tenantId);
      const name=t?t.name:'(eliminado)', photo=t?t.photo:null;
      const row=document.createElement('div'); row.className='log-entry';
      const face=document.createElement('div'); face.className='log-face';
      if (photo) face.innerHTML=`<img src="${photo}" alt="${name}">`;
      else face.textContent=idx>=0?tenantEmoji(idx):'👤';
      const info=document.createElement('div'); info.className='log-info';
      info.innerHTML=`<div class="log-name">${name}</div><div class="log-desc">${l.inside?'<span class="ev-in">✅ Entró</span>':'<span class="ev-out">❌ Salió</span>'}</div>`;
      const timeDiv=document.createElement('div'); timeDiv.className='log-time'; timeDiv.textContent=fmtTime(l.ts);
      if (l.corrected) { const s=document.createElement('span'); s.className='corrected'; s.textContent='⚠ corregida'; timeDiv.appendChild(s); }
      const del=document.createElement('button'); del.className='log-del'; del.textContent='✕';
      del.addEventListener('click', () => deleteLog(l.id));
      row.appendChild(face); row.appendChild(info); row.appendChild(timeDiv); row.appendChild(del);
      dayDiv.appendChild(row);
    });
    body.appendChild(dayDiv);
  });
}
function deleteLog(id) { saveLogs(loadLogs().filter(l=>l.id!==id)); saveLogs(loadLogs().filter(l=>l.id!==id)); renderLogs(); pushToCloud(); }
function clearLogs()   { if (!confirm('¿Borrar todo el historial?')) return; saveLogs([]); renderLogs(); pushToCloud(); showToast('Historial borrado'); }
function exportCSV() {
  const tenants=loadTenants(), logs=loadLogs();
  if (!logs.length) { showToast('No hay registros'); return; }
  const rows=[['Nombre','Evento','Hora','Fecha','Hora corregida']];
  logs.forEach(l=>{const t=tenants.find(x=>x.id===l.tenantId),d=new Date(l.ts);rows.push([t?t.name:'Desconocido',l.inside?'ENTRADA':'SALIDA',d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}),l.corrected?'Sí':'No']);});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv); a.download='presencia_'+todayStr()+'.csv'; a.click();
}

/* ═══════════════════════════════════════
   EDIT PANEL
═══════════════════════════════════════ */
let editOpen=false, editTenants=[];

function toggleEdit() {
  editOpen=!editOpen;
  document.getElementById('editPanel').classList.toggle('open',editOpen);
  document.getElementById('btnEdit').classList.toggle('active',editOpen);
  document.getElementById('btnEdit').textContent=editOpen?'✕ Cerrar':'✏️ Editar';
  if (editOpen) { editTenants=loadTenants().map(t=>({...t})); renderEditList(); }
}
function renderEditList() {
  const list=document.getElementById('editList'); list.innerHTML='';
  editTenants.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='edit-row';
    const wrap=document.createElement('div'); wrap.className='avatar-wrap'; wrap.title='Cambiar foto';
    const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.className='avatar-file-input';
    fi.addEventListener('change',e=>handlePhotoUpload(e,i));
    let av; if(t.photo){av=document.createElement('img');av.className='avatar-preview';av.src=t.photo;}else{av=document.createElement('div');av.className='avatar-emoji-preview';av.textContent=tenantEmoji(i);}
    const ov=document.createElement('div'); ov.className='avatar-overlay'; ov.textContent='📷';
    wrap.appendChild(fi); wrap.appendChild(av); wrap.appendChild(ov); wrap.addEventListener('click',()=>fi.click());
    const fields=document.createElement('div'); fields.className='edit-fields';
    const lbl=document.createElement('div'); lbl.className='field-label'; lbl.textContent='Nombre';
    const inp=document.createElement('input'); inp.className='field-input'; inp.type='text'; inp.value=t.name; inp.placeholder='Nombre';
    inp.addEventListener('input',()=>{editTenants[i].name=inp.value;});
    fields.appendChild(lbl); fields.appendChild(inp);
    if(t.photo){const rm=document.createElement('button');rm.className='btn-remove-photo';rm.textContent='✕ Quitar foto';rm.addEventListener('click',()=>{editTenants[i].photo=null;renderEditList();});fields.appendChild(rm);}
    const del=document.createElement('button'); del.className='btn-del-row'; del.textContent='🗑';
    del.addEventListener('click',()=>{if(editTenants.length<=1){showToast('Debe haber al menos 1');return;}editTenants.splice(i,1);renderEditList();});
    row.appendChild(wrap); row.appendChild(fields); row.appendChild(del); list.appendChild(row);
  });
}
function handlePhotoUpload(e,idx) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'),max=220;let w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      editTenants[idx].photo=canvas.toDataURL('image/jpeg',0.78);renderEditList();
    };img.src=ev.target.result;
  };reader.readAsDataURL(file);
}
function addTenant() {
  editTenants.push({id:uid(),name:'Nuevo',photo:null});renderEditList();
  setTimeout(()=>document.getElementById('editList').lastElementChild.scrollIntoView({behavior:'smooth',block:'center'}),100);
}
function saveEdits() {
  if(!editTenants.every(t=>t.name.trim().length>0)){showToast('Todos los nombres deben tener texto');return;}
  editTenants.forEach(t=>{t.name=t.name.trim();}); saveTenants(editTenants);
  renderCards(); if(logsOpen)renderLogs(); toggleEdit();
  pushToCloud();
  showToast('✅ Cambios guardados');
}

/* ═══════════════════════════════════════
   CLOCK + INIT
═══════════════════════════════════════ */
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleString('es-MX',{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);
updateClock();

/* Arranque: primero muestra datos locales, luego sincroniza */
renderCards();
pullFromCloud().then(() => { renderCards(); if(logsOpen) renderLogs(); });

/* Service Worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
